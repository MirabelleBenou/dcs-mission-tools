<!DOCTYPE html>
<!--
  Loadout Editor v1.2.1
  =====================
  Applique en masse un emport existant (et une livrée) à des appareils du même type,
  joueurs et IA, dans un fichier .miz DCS World. Composer un emport pylône par pylône
  n'est pas l'objet de cet outil.

  Version    : 1.2.1
  Licence    : MIT
  Dépendances: JSZip 3.10.1 — inliné (aucune dépendance externe)
  Usage      : Ouvrir dans Chrome/Firefox, charger un .miz, cocher des appareils, appliquer, sauvegarder.

  Architecture : Single-file HTML autonome, châssis du Ground Unit Swapper.
    - Moteur .miz (tokeniseur, parseur, extracteur, applyPatches, retokenizeSafety, rebuildMiz)
      copié depuis dcs_comm_plan_editor.html, sans modification de fond ; l'extracteur et le
      tokeniseur portent les greffes du paquet de vol (positions de livrée et d'emport, Player
      compté comme Client, échappement décimal \ddd).
    - Sérialiseur Lua (astToValue, formatLuaNumber, serializeLua, deepEqValues, rebuildMizHQ)
      copié à l'identique du projet frère Mission Plan.
    - Parcours des appareils, interface, écriture : spécifiques à cet outil.
-->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loadout Editor v1.2.1</title>
  <style>
    /* ── Variables palette ─────────────────────────────────────────────────── */
    :root {
      --bg:           #1A1A1A;
      --surface:      #272727;
      --surface-2:    #2A2A2A;
      --surface-3:    #303030;
      --border:       #3C3C3C;
      --border-focus: #D46A4C;
      --text:         #ECECEC;
      --text-2:       #CACACA;
      --text-dim:     #9E9E9E;

      /* Point de couleur unique de l'outil */
      --accent:       #D46A4C;
      --accent-dim:   rgba(212,106,76,0.15);
      --accent-glow:  rgba(212,106,76,0.25);

      --warn:         #FF8C00;
      --error:        #E53935;
      --success:      #4CAF50;

      /* Coalitions */
      --coal-blue:    #1E3A5F;
      --coal-red:     #5F1E1E;
      --coal-neutral: #3A3A1E;

      --font-ui:   system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "Roboto Mono", "Courier New", monospace;
    }

    /* ── Reset & base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 13px;
      line-height: 1.5;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ───────────────────────────────────────────────────────────── */
    #app-header {
      background: var(--surface);
      border-bottom: 2px solid var(--accent);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .header-logo {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    .header-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      color: var(--text);
    }
    .header-version {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      background: var(--surface-2);
      padding: 2px 6px;
      border-radius: 3px;
    }
    .header-miz {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent);
      max-width: 400px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .header-miz.empty { color: var(--text-dim); font-style: italic; }

    /* ── Bouton langue ────────────────────────────────────────────────────── */
    .header-lang-btn {
      background: transparent;
      border: 1px solid var(--border);
      height: 28px; min-width: 38px; padding: 0 8px;
      border-radius: 4px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: all .15s ease;
      margin-left: 8px;
      flex-shrink: 0;
    }
    .header-lang-btn:hover { border-color: var(--accent); }
    .header-lang-btn svg { display: block; width: 22px; height: 15px; border: 1px solid rgba(0,0,0,.35); }

    /* ── Drop zone ────────────────────────────────────────────────────────── */
    #drop-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 60px 20px;
    }
    #drop-zone.hidden { display: none; }
    .drop-box {
      border: 2px dashed rgba(212,106,76,0.45);
      border-radius: 12px;
      padding: 60px 80px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .drop-box:hover, .drop-box.drag-over {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .drop-icon { font-size: 48px; margin-bottom: 16px; }
    .drop-title { font-size: 18px; font-weight: 600; color: var(--accent); margin-bottom: 8px; }
    .drop-sub { color: var(--text-dim); font-size: 13px; }
    .btn-load {
      background: var(--accent);
      color: #1A1A1A;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 28px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-load:hover { background: #e07f63; }

    /* ── Main UI ──────────────────────────────────────────────────────────── */
    #main-ui { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow-y: auto; }
    #main-ui.hidden { display: none; }

    /* ── Filters bar ─────────────────────────────────────────────────────── */
    #filters-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 6px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    .filter-group { display: flex; flex-direction: column; gap: 2px; }
    .filter-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
    .filter-group select, .filter-group input[type="text"] {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-family: inherit;
      min-width: 120px;
      min-height: 26px;
    }
    .filter-group select:focus, .filter-group input:focus { outline: none; border-color: var(--accent); }
    .filter-group input[type="text"] { min-width: 200px; }

    /* ── Table info bar (compteurs + toggle) ─────────────────────────────── */
    #table-info-bar {
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      padding: 3px 20px;
      display: flex;
      align-items: center;
      gap: 6px 16px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .display-count { font-size: 12px; color: var(--text-dim); }
    .display-count span { color: var(--text); font-weight: 600; }
    .sel-count { font-size: 12px; color: var(--accent); font-family: var(--font-mono); }
    .toggle-modified {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--accent);
      cursor: pointer;
      user-select: none;
    }
    .toggle-modified input[type="checkbox"] { accent-color: var(--accent); width: 13px; height: 13px; cursor: pointer; }

    /* ── Corps : liste + panneau du type ─────────────────────────────────── */
    #le-body { flex: 1; min-height: 0; display: flex; }
    #list-pane { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    #table-container { flex: 1; min-height: 0; overflow: auto; }

    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    thead { position: sticky; top: 0; background: var(--surface); z-index: 10; }
    th {
      padding: 8px 10px;
      text-align: left;
      color: var(--text-dim);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      border-bottom: 2px solid rgba(212,106,76,0.45);
      white-space: nowrap;
      user-select: none;
    }
    th.th-chk { width: 36px; }
    td {
      padding: 4px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr.row-unit:hover td { background: var(--surface-2); }
    tr.row-modified td { background: rgba(212,106,76,0.05); }
    td.td-chk { width: 36px; }

    tr.row-type td {
      background: var(--surface-3);
      border-bottom: 1px solid var(--border);
      padding: 5px 10px;
      font-weight: 600;
    }
    .type-head { display: flex; align-items: center; gap: 8px; }
    .type-caret {
      background: none; border: none; color: var(--text-dim); cursor: pointer;
      font-size: 11px; width: 18px; height: 22px; padding: 0;
    }
    .type-caret:hover { color: var(--accent); }
    .type-name { font-family: var(--font-mono); color: var(--text); }
    .type-meta { font-weight: 400; color: var(--text-dim); font-size: 11px; }

    input[type="checkbox"] { width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer; }

    .role-badge {
      display: inline-block; padding: 1px 6px; border-radius: 3px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap;
    }
    .role-player { background: var(--accent-dim); color: var(--accent); }
    .role-ai { background: rgba(158,158,158,0.15); color: var(--text-dim); }

    .coal-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    .coal-dot.blue { background: #5b8fd6; }
    .coal-dot.red { background: #d65b5b; }
    .coal-dot.neutrals { background: #c9c96a; }

    .ld-badge {
      display: inline-block; min-width: 24px; padding: 1px 6px; text-align: center;
      font-family: var(--font-mono); font-weight: 700; font-size: 12px;
      border: 1px solid var(--border); border-radius: 3px; color: var(--text);
      background: var(--surface-2);
    }
    .ld-badge.warn { border-color: var(--warn); color: var(--warn); }
    .ld-badge.changed { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
    td.cell-livery.changed { color: var(--accent); }
    .none { color: var(--text-dim); font-style: italic; }
    .narrow-only { display: none; }
    .btn-undo-cell {
      background: none; border: 1px solid var(--border); border-radius: 3px;
      color: var(--text-dim); font-size: 12px; line-height: 1; padding: 2px 5px;
      cursor: pointer; margin-left: 4px; vertical-align: middle;
    }
    .btn-undo-cell:hover { border-color: var(--accent); color: var(--accent); }

    #empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); display: none; }

    /* ── Panneau du type ─────────────────────────────────────────────────── */
    #type-panel {
      width: 400px; flex-shrink: 0; overflow-y: auto; min-height: 0;
      background: var(--surface); border-left: 1px solid var(--border);
    }
    #type-panel.hidden { display: none; }
    .panel-head { padding: 10px 14px; border-bottom: 1px solid var(--border); border-top: 2px solid var(--accent); }
    .panel-type { font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--accent); }
    .panel-sel { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
    .panel-sel .warn { color: var(--warn); }
    details.panel-sec { border-bottom: 1px solid var(--border); }
    details.panel-sec > summary {
      cursor: pointer; list-style: none; padding: 9px 14px;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-2); user-select: none; display: flex; align-items: center; gap: 8px;
    }
    details.panel-sec > summary::-webkit-details-marker { display: none; }
    details.panel-sec > summary::before { content: '▸'; color: var(--accent); font-size: 10px; }
    details.panel-sec[open] > summary::before { content: '▾'; }
    .sec-body { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 8px; }

    .ld-card, .lv-card {
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px;
      padding: 8px 10px; display: flex; flex-direction: column; gap: 6px;
    }
    .ld-card-top, .lv-card-top { display: flex; align-items: center; gap: 8px; }
    .ld-count, .lv-count { color: var(--text-dim); font-size: 12px; flex: 1; min-width: 0; }
    .lv-name { font-family: var(--font-mono); font-size: 12px; color: var(--text); word-break: break-word; }
    .lv-country { font-size: 11px; color: var(--text-dim); }
    .lv-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .ld-pylons { font-family: var(--font-mono); font-size: 11px; color: var(--text-2); line-height: 1.45; overflow-wrap: anywhere; }
    .ld-pylons .pn { color: var(--text-dim); }
    .ld-card, .lv-card { cursor: pointer; transition: border-color 0.15s, background 0.15s; }
    .ld-card:hover, .lv-card:hover { border-color: var(--text-dim); }
    .ld-card:focus-visible, .lv-card:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
    .ld-card.chosen, .lv-card.chosen { border-color: var(--accent); background: var(--accent-dim); }
    .ld-card.chosen .ld-badge { background: var(--accent); border-color: var(--accent); color: #1A1A1A; }
    .lv-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; }
    .lv-card.chosen .lv-dot { background: var(--accent); border-color: var(--accent); }
    .ld-badge.ld-arrow { white-space: nowrap; }
    #action-bar {
      position: sticky; bottom: 0; z-index: 5; background: var(--surface);
      border-top: 2px solid var(--accent); padding: 8px 14px; display: flex; flex-direction: column; gap: 8px;
    }
    .bar-row { display: flex; align-items: center; gap: 10px; }
    .bar-text { flex: 1; min-width: 0; font-size: 12px; color: var(--text); line-height: 1.35; }

    .btn-apply {
      background: transparent; color: var(--accent); font-weight: 700; font-size: 12px;
      padding: 5px 12px; border: 1px solid var(--accent); border-radius: 4px; cursor: pointer;
      transition: background 0.15s, color 0.15s; white-space: nowrap; min-height: 28px;
    }
    .btn-apply:hover:not(:disabled), .btn-apply:focus-visible:not(:disabled) { background: var(--accent); color: #1A1A1A; outline: none; }
    .btn-apply:disabled { opacity: 0.35; cursor: default; }

    .set-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .set-field { display: flex; flex-direction: column; gap: 2px; }
    .set-field label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
    .set-field input {
      background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
      padding: 4px 6px; border-radius: 4px; font-size: 12px; font-family: var(--font-mono);
      min-height: 28px; width: 100%;
    }
    .set-field input:focus { outline: none; border-color: var(--accent); }
    .set-hint { font-size: 11px; color: var(--text-dim); }
    .set-actions { display: flex; align-items: center; gap: 10px; }

    /* ── Footer sticky modifications ──────────────────────────────────────── */
    #modifications-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    #modifications-bar.hidden { display: none; }
    #mod-count { font-size: 13px; color: var(--text-dim); }
    #mod-count strong { color: var(--accent); font-family: var(--font-mono); }
    .btn-footer {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text-dim);
      font-family: var(--font-ui);
      font-size: 12px;
      padding: 5px 12px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      min-height: 30px;
    }
    .btn-footer:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
    .btn-footer:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-footer.primary { border-color: var(--accent); color: var(--accent); }
    .btn-footer.primary:disabled { border-color: var(--border); color: var(--text-dim); opacity: 0.4; }
    #btn-save { margin-left: auto; }

    /* ── Toast ───────────────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 13px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 1000;
      max-width: 420px;
      white-space: pre-line;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.toast-success { border-color: var(--accent); }
    #toast.toast-error   { border-color: var(--error);  }
    #toast.toast-warn    { border-color: var(--warn);   }

    /* ── Spinner ─────────────────────────────────────────────────────────── */
    #spinner {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    #spinner.hidden { display: none; }
    .spinner-box {
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 32px 48px;
      text-align: center;
    }
    .spinner-anim {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-msg { color: var(--text-dim); font-size: 13px; }

    /* ── Onglets (téléphone) ─────────────────────────────────────────────── */
    #le-tabs {
      display: none; position: sticky; top: 0; z-index: 20; flex-shrink: 0;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .le-tab {
      flex: 1; background: transparent; border: none; border-bottom: 2px solid transparent;
      color: var(--text-dim); font-family: var(--font-ui); font-size: 13px; font-weight: 600;
      padding: 10px 8px; min-height: 44px; cursor: pointer;
    }
    .le-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .le-tab:disabled { opacity: 0.35; cursor: default; }
    .le-tab:focus-visible { outline: 1px solid var(--accent); outline-offset: -3px; }

    /* ── Tablette / téléphone ────────────────────────────────────────────── */
    @media (max-width: 768px) {
      #le-tabs { display: flex; }
      #le-body { flex: none; flex-direction: column; }
      #list-pane { flex: none; }
      #table-container { flex: none; overflow-x: auto; overflow-y: visible; }
      thead { position: static; }
      #type-panel { width: auto; border-left: none; overflow: visible; }
      #le-body[data-tab="list"] #type-panel { display: none; }
      #le-body[data-tab="panel"] #list-pane { display: none; }
    }
    @media (max-width: 700px) {
      .c-role, .c-country { display: none; }
      .narrow-only { display: block; font-size: 10px; color: var(--text-dim); }
      table { table-layout: fixed; }
      th.th-chk, td.td-chk { width: 30px; padding-left: 6px; padding-right: 4px; }
      th.th-ld, td.td-ld { width: 70px; }
      th, td { padding-left: 6px; padding-right: 6px; overflow-wrap: anywhere; }
      th { white-space: normal; letter-spacing: 0.03em; }
    }
    @media (max-width: 560px) {
      #app-header { padding: 8px 10px; gap: 8px; }
      .header-lang-btn { margin-left: 0; }
      #filters-bar, #table-info-bar { padding-left: 10px; padding-right: 10px; }
      .filter-group { flex: 1 1 140px; }
      .filter-group select, .filter-group input[type="text"] { width: 100%; min-width: 0; }
      #modifications-bar { padding: 8px 10px; gap: 8px; }
      .drop-box { padding: 36px 24px; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════════ -->
<!-- HEADER -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<header id="app-header">
  <div class="header-logo">L·E</div>
  <div class="header-title" data-i18n="app.title">Loadout Editor</div>
  <div class="header-version">v1.2.1</div>
  <div class="header-miz empty" id="header-miz" data-i18n="header.noFile">Aucun fichier chargé</div>
  <button class="header-lang-btn" id="btn-lang" title="Switch language / Changer de langue"></button>
</header>

<!-- ═══════════════════════════════════════════════════════════════════════ -->
<!-- DROP ZONE -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<div id="drop-zone">
  <div class="drop-box" id="drop-box">
    <div class="drop-icon">🎯</div>
    <div class="drop-title" data-i18n="drop.title">Déposer un fichier .miz ici</div>
    <div class="drop-sub" data-i18n="drop.sub">ou cliquer pour parcourir</div>
  </div>
  <button class="btn-load" id="btn-browse" data-i18n="drop.btn">📂 Choisir un fichier .miz</button>
  <input type="file" id="file-input" accept=".miz" style="display:none">
</div>

<!-- ═══════════════════════════════════════════════════════════════════════ -->
<!-- MAIN UI (masqué avant chargement) -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<div id="main-ui" class="hidden">

  <!-- Filters -->
  <div id="filters-bar">
    <div class="filter-group">
      <label class="filter-label" for="filter-coalition" data-i18n="filter.coalition">Coalition</label>
      <select id="filter-coalition">
        <option value="" data-i18n="filter.all">Toutes</option>
        <option value="blue">🔵 Blue</option>
        <option value="red">🔴 Red</option>
        <option value="neutrals">⚪ Neutrals</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label" for="filter-type" data-i18n="filter.type">Type</label>
      <select id="filter-type"></select>
    </div>
    <div class="filter-group">
      <label class="filter-label" for="filter-role" data-i18n="filter.role">Rôle</label>
      <select id="filter-role">
        <option value="" data-i18n="filter.role.all">Joueurs et IA</option>
        <option value="player" data-i18n="filter.role.player">Joueurs</option>
        <option value="ai" data-i18n="filter.role.ai">IA</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label" for="filter-search" data-i18n="filter.search">Recherche libre</label>
      <input type="text" id="filter-search" placeholder="Rechercher…" data-i18n-placeholder="filter.search.ph" autocomplete="off">
    </div>
  </div>

  <!-- Onglets (visibles sous 768 px) -->
  <div id="le-tabs" role="tablist">
    <button class="le-tab active" id="tab-list" role="tab" data-tab="list" data-i18n="tab.aircraft">Appareils</button>
    <button class="le-tab" id="tab-panel" role="tab" data-tab="panel" disabled data-i18n="tab.loadouts">Emports</button>
  </div>

  <!-- Info tableau : compteurs + toggle -->
  <div id="table-info-bar">
    <div class="display-count" id="display-count"></div>
    <div class="sel-count" id="sel-count"></div>
    <label class="toggle-modified" id="toggle-modified-wrap" style="display:none">
      <input type="checkbox" id="toggle-modified">
      <span data-i18n="toggle.modified">Modifiés uniquement</span>
    </label>
  </div>

  <!-- Corps : liste + panneau du type -->
  <div id="le-body" data-tab="list">
    <div id="list-pane">
      <div id="table-container">
        <table id="units-table">
          <thead>
            <tr>
              <th class="th-chk"><input type="checkbox" id="chk-all" title="Cocher/décocher les visibles" data-i18n-title="table.checkAll"></th>
              <th class="c-group" data-i18n="table.col.group">Groupe</th>
              <th class="c-unit" data-i18n="table.col.unit">Unité</th>
              <th class="c-role" data-i18n="table.col.role">Rôle</th>
              <th class="c-country" data-i18n="table.col.country">Pays</th>
              <th class="th-ld" data-i18n="table.col.loadout">Emport</th>
              <th class="c-livery" data-i18n="table.col.livery">Livrée</th>
            </tr>
          </thead>
          <tbody id="units-tbody"></tbody>
        </table>
        <div id="empty-state" data-i18n="table.empty">Aucun appareil ne correspond aux filtres actifs.</div>
      </div>
    </div>

    <aside id="type-panel" class="hidden">
      <div class="panel-head">
        <div class="panel-type" id="panel-type"></div>
        <div class="panel-sel" id="panel-sel"></div>
      </div>
      <details class="panel-sec" open>
        <summary data-i18n="panel.loadouts">Emports de ce type</summary>
        <div class="sec-body" id="panel-loadouts"></div>
      </details>
      <details class="panel-sec" open>
        <summary data-i18n="panel.settings">Réglages</summary>
        <div class="sec-body">
          <div class="set-grid">
            <div class="set-field"><label for="set-fuel"><span data-i18n="panel.fuel">Carburant</span> (kg)</label><input type="number" id="set-fuel" min="0" step="any" inputmode="decimal"></div>
            <div class="set-field"><label for="set-flare" data-i18n="panel.flares">Leurres</label><input type="number" id="set-flare" min="0" step="1" inputmode="numeric"></div>
            <div class="set-field"><label for="set-chaff" data-i18n="panel.chaff">Paillettes</label><input type="number" id="set-chaff" min="0" step="1" inputmode="numeric"></div>
            <div class="set-field"><label for="set-gun"><span data-i18n="panel.gun">Canon</span> (%)</label><input type="number" id="set-gun" min="0" max="100" step="1" inputmode="numeric"></div>
          </div>
          <div class="set-hint" data-i18n="panel.settings.hint">Un champ vide ne change rien.</div>
          <div class="set-actions"><button class="btn-apply" id="btn-apply-settings" data-i18n="panel.apply">Appliquer à la sélection</button></div>
        </div>
      </details>
      <details class="panel-sec" open>
        <summary data-i18n="panel.liveries">Livrées de ce type</summary>
        <div class="sec-body" id="panel-liveries"></div>
      </details>
      <div id="action-bar" aria-live="polite"></div>
    </aside>
  </div>
</div>

<!-- Spinner -->
<div id="spinner" class="hidden">
  <div class="spinner-box">
    <div class="spinner-anim"></div>
    <div class="spinner-msg" id="spinner-msg" data-i18n="spinner.loading">Chargement…</div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- ── Footer sticky modifications ─────────────────────────────────────── -->
<footer id="modifications-bar" class="hidden">
  <div id="mod-count"><strong>0</strong> appareil modifié</div>
  <button class="btn-footer" id="btn-load-new" title="Charger un autre .miz" data-i18n-title="footer.loadNew.title" data-i18n="footer.loadNew">📂 Charger un autre .miz</button>
  <button class="btn-footer" id="btn-revert-all" disabled data-i18n-title="footer.revertAll.title" data-i18n="footer.revertAll">↺ Tout annuler</button>
  <button class="btn-footer primary" id="btn-save" disabled title="Aucune modification à sauvegarder" data-i18n-title="footer.save.titleDisabled" data-i18n="footer.save">💾 Sauvegarder</button>
</footer>

let CURRENT_LANG = 'fr';

function t(key, fallback) {
  const dict = I18N[CURRENT_LANG] || I18N.fr;
  if (key in dict) return dict[key];
  if (fallback !== undefined) return fallback;
  if (key in I18N.fr) return I18N.fr[key];
  console.warn('[i18n] clé manquante:', key);
  return key;
}

// Pluriel : clé.one pour 0 et 1, clé.other au-delà
function tn(key, n, shown) {
  return t(key + (n > 1 ? '.other' : '.one')).replace('{n}', shown === undefined ? n : shown);
}

const KEY_LANG = 'le_lang_v1';
const LANG_KEYS = ['lang_v1', 'cpe_lang_v1', 'gus_lang_v1', 'wx_lang_v1', 'le_lang_v1'];

// Une seule langue pour toute la suite : chaque setLang écrit les cinq clés,
// et ce document applique un changement venu d'un autre (évènement storage).
function persistLang(lang) {
  LANG_KEYS.forEach(function(k) {
    try { localStorage.setItem(k, lang); } catch(e) {}
  });
}

function initLang() {
  let stored = null;
  try { stored = localStorage.getItem(KEY_LANG); } catch(e) {}
  if (stored === 'fr' || stored === 'en') CURRENT_LANG = stored;
  else {
    const nav = (navigator.language || 'fr').toLowerCase();
    CURRENT_LANG = nav.startsWith('fr') ? 'fr' : 'en';
    try { localStorage.setItem(KEY_LANG, CURRENT_LANG); } catch(e) {}
  }
  document.documentElement.lang = CURRENT_LANG;
}

function setLang(lang, fromStorage) {
  if (lang !== 'fr' && lang !== 'en') return;
  if (lang === CURRENT_LANG) return;
  CURRENT_LANG = lang;
  if (!fromStorage) persistLang(lang);
  document.documentElement.lang = CURRENT_LANG;
  updateFlagButton();
  updateDocTitle();
  try { applyI18nStatic(); } catch(e) { console.warn('[i18n] applyI18nStatic:', e); }
  try { if (UI_STATE.model) renderAll(); } catch(e) { console.warn('[i18n] renderAll:', e); }
}

window.addEventListener('storage', function(e) {
  if (LANG_KEYS.indexOf(e.key) === -1) return;
  if (e.newValue === 'fr' || e.newValue === 'en') setLang(e.newValue, true);
});

function applyI18nStatic() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    // Le nom du fichier chargé n'est pas un libellé : seul l'état vide suit la langue.
    if (el.id === 'header-miz' && !el.classList.contains('empty')) return;
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
}

function updateDocTitle() { document.title = t('doc.title'); }

function updateFlagButton() {
  const btn = document.getElementById('btn-lang');

  if (CURRENT_LANG === 'fr') { btn.innerHTML = FLAG_GB; btn.title = 'Switch to English'; }

}

// ── DCS_TOKENIZER — copié de dcs_comm_plan_editor.html, avec la greffe de l'échappement
//    décimal \ddd (un à trois chiffres) que serializeLua écrit pour les caractères sous U+0020.
const DCS_TOKENIZER = (() => {
  const T = { IDENT:'IDENT',LBRACE:'LBRACE',RBRACE:'RBRACE',LBRACKET:'LBRACKET',RBRACKET:'RBRACKET',EQ:'EQ',COMMA:'COMMA',SEMICOLON:'SEMICOLON',NUMBER:'NUMBER',STRING:'STRING',BOOL:'BOOL',NIL:'NIL',COMMENT:'COMMENT',EOF:'EOF' };
  function tokenize(src) {
    const tokens=[],errors=[];let offset=0,line=0,col=0;const len=src.length;
    function advance(){if(offset<len){if(src[offset]==='\n'){line++;col=0;}else{col++;}offset++;}}
    function skipWS(){while(offset<len&&' \t\r\n'.includes(src[offset]))advance();}
    function pos(){return{offset,line,col};}
    function readComment(s){let v='--';while(offset<len&&src[offset]!=='\n'){v+=src[offset];advance();}tokens.push({type:T.COMMENT,value:v,start:s,end:pos()});}
    function readNumber(s,f){let r=f;while(offset<len&&/[0-9]/.test(src[offset])){r+=src[offset];advance();}if(offset<len&&src[offset]==='.'){r+='.';advance();while(offset<len&&/[0-9]/.test(src[offset])){r+=src[offset];advance();}}if(offset<len&&(src[offset]==='e'||src[offset]==='E')){r+=src[offset];advance();if(offset<len&&(src[offset]==='+'||src[offset]==='-')){r+=src[offset];advance();}while(offset<len&&/[0-9]/.test(src[offset])){r+=src[offset];advance();}}tokens.push({type:T.NUMBER,value:parseFloat(r),raw:r,start:s,end:pos()});}
    function readString(s,q){let v='';while(offset<len){const c=src[offset];if(c===q){advance();break;}if(c==='\\'){advance();const e=src[offset];if(e==='"')v+='"';else if(e==="'")v+="'";else if(e==='\\')v+='\\';else if(e==='n')v+='\n';else if(e==='t')v+='\t';else if(e==='r')v+='\r';else if(/[0-9]/.test(e)){let d=e;while(d.length<3&&offset+1<len&&/[0-9]/.test(src[offset+1])){advance();d+=src[offset];}v+=String.fromCharCode(parseInt(d,10));}else v+=e;advance();}else{v+=c;advance();}}tokens.push({type:T.STRING,value:v,start:s,end:pos()});}
    function readIdent(s,f){let r=f;while(offset<len&&/[a-zA-Z0-9_]/.test(src[offset])){r+=src[offset];advance();}if(r==='true')tokens.push({type:T.BOOL,value:true,raw:r,start:s,end:pos()});else if(r==='false')tokens.push({type:T.BOOL,value:false,raw:r,start:s,end:pos()});else if(r==='nil')tokens.push({type:T.NIL,value:null,raw:r,start:s,end:pos()});else tokens.push({type:T.IDENT,value:r,start:s,end:pos()});}
    while(offset<len){skipWS();if(offset>=len)break;const s=pos(),ch=src[offset];if(ch==='-'&&offset+1<len&&src[offset+1]==='-'){advance();advance();readComment(s);continue;}if(/[0-9]/.test(ch)){advance();readNumber(s,ch);continue;}if(ch==='-'&&offset+1<len&&/[0-9]/.test(src[offset+1])){advance();readNumber(s,'-');continue;}if(ch==='"'||ch==="'"){advance();readString(s,ch);continue;}if(/[a-zA-Z_]/.test(ch)){advance();readIdent(s,ch);continue;}switch(ch){case'{':advance();tokens.push({type:T.LBRACE,value:'{',start:s,end:pos()});break;case'}':advance();tokens.push({type:T.RBRACE,value:'}',start:s,end:pos()});break;case'[':advance();tokens.push({type:T.LBRACKET,value:'[',start:s,end:pos()});break;case']':advance();tokens.push({type:T.RBRACKET,value:']',start:s,end:pos()});break;case'=':advance();tokens.push({type:T.EQ,value:'=',start:s,end:pos()});break;case',':advance();tokens.push({type:T.COMMA,value:',',start:s,end:pos()});break;case';':advance();tokens.push({type:T.SEMICOLON,value:';',start:s,end:pos()});break;default:errors.push({message:'Token inattendu: '+JSON.stringify(ch),line:s.line,col:s.col,offset:s.offset});advance();tokens.push({type:'ERROR',value:ch,start:s,end:pos()});}}
    tokens.push({type:T.EOF,value:null,start:pos(),end:pos()});
    return{tokens,errors};
  }
  return{tokenize,T};
})();

// ── DCS_PARSER — copié de dcs_comm_plan_editor.html, sans modification.
const DCS_PARSER = (() => {

  class ParseError extends Error {
    constructor(msg, token) {
      super(msg);
      this.tokenLine   = token ? token.start.line + 1 : '?';
      this.tokenCol    = token ? token.start.col      : '?';
      this.tokenOffset = token ? token.start.offset   : '?';
    }
    toString() { return `ParseError L${this.tokenLine}:${this.tokenCol} — ${this.message}`; }
  }

  function parse(tokens) {
    const tks = tokens.filter(t => t.type !== 'COMMENT');
    let p = 0;

    function peek()    { return tks[p]; }
    function consume() { return tks[p++]; }

    function expect(type) {
      const tk = peek();
      if (!tk || tk.type !== type)
        throw new ParseError(
          `Attendu ${type}, obtenu ${tk ? tk.type + '(' + JSON.stringify(tk.value) + ')' : 'EOF'}`,
          tk
        );
      return consume();
    }

    function skipSep() {
      while (peek() && (peek().type === 'COMMA' || peek().type === 'SEMICOLON')) consume();
    }

    // Construire un objet pos à partir de deux tokens de borne
    function makePos(startTk, endTk) {
      return {
        start: { line: startTk.start.line, col: startTk.start.col, offset: startTk.start.offset },
        end:   { line: endTk.end.line,     col: endTk.end.col,     offset: endTk.end.offset     }
      };
    }

    function parseValue() {
      const tk = peek();
      if (!tk || tk.type === 'EOF') throw new ParseError('Valeur attendue, EOF atteint', tk);

      if (tk.type === 'NUMBER') { consume(); return { kind:'number', value:tk.value, raw:tk.raw,   pos:makePos(tk,tk) }; }
      if (tk.type === 'STRING') { consume(); return { kind:'string', value:tk.value,                pos:makePos(tk,tk) }; }
      if (tk.type === 'BOOL')   { consume(); return { kind:'bool',   value:tk.value, raw:tk.raw,   pos:makePos(tk,tk) }; }
      if (tk.type === 'NIL')    { consume(); return { kind:'nil',                                   pos:makePos(tk,tk) }; }
      if (tk.type === 'LBRACE') { return parseTable(); }
      if (tk.type === 'IDENT')  { consume(); return { kind:'ident',  value:tk.value,               pos:makePos(tk,tk) }; }

      throw new ParseError(`Token inattendu comme valeur: ${tk.type}(${JSON.stringify(tk.value)})`, tk);
    }

    function parseTable() {
      const lbrace = expect('LBRACE');
      const entries = [];
      while (true) {
        skipSep();
        const tk = peek();
        if (!tk || tk.type === 'RBRACE' || tk.type === 'EOF') break;
        entries.push(parseEntry());
        skipSep();
      }
      const rbrace = expect('RBRACE');
      return { kind:'table', entries, pos: makePos(lbrace, rbrace) };
    }

    function parseEntry() {
      const tk = peek();

      // [N] = v  ou  ["clé"] = v
      if (tk.type === 'LBRACKET') {
        const lbrack = consume();
        const kt = peek();
        let key;
        if      (kt.type === 'NUMBER') { consume(); key = { kind:'int',    value:kt.value }; }
        else if (kt.type === 'STRING') { consume(); key = { kind:'string', value:kt.value }; }
        else throw new ParseError(`Clé invalide dans []: attendu NUMBER ou STRING, obtenu ${kt.type}`, kt);
        const rbrack = expect('RBRACKET');
        const keyPos = makePos(lbrack, rbrack);
        expect('EQ');
        const value = parseValue();
        return { key, keyPos, value, valuePos: value.pos };
      }

      // ident = v  (racine ou clé nue rare)
      if (tk.type === 'IDENT' && tks[p + 1] && tks[p + 1].type === 'EQ') {
        const it = consume();
        const key    = { kind:'ident', value:it.value };
        const keyPos = makePos(it, it);
        consume(); // EQ
        const value = parseValue();
        return { key, keyPos, value, valuePos: value.pos };
      }

      // Valeur sans clé (liste ordonnée)
      const value = parseValue();
      return { key:null, keyPos:null, value, valuePos: value.pos };
    }

    // Point d'entrée : "mission = { … }"
    const first = peek();
    let root;
    if (first.type === 'IDENT') {
      const nt = consume();
      expect('EQ');
      const value = parseValue();
      root = {
        kind: 'assignment', name: nt.value, value,
        pos:  { start: { line:nt.start.line, col:nt.start.col, offset:nt.start.offset },
                end:   value.pos.end }
      };
    } else if (first.type === 'LBRACE') {
      root = parseValue();
    } else {
      throw new ParseError(`Structure racine inattendue: ${first.type}`, first);
    }

    const eof = peek();
    if (eof.type !== 'EOF')
      throw new ParseError(`Contenu inattendu après table racine: ${eof.type}`, eof);

    return root;
  }

  return { parse, ParseError };
})();

// ── DCS_EXTRACTOR — copié de dcs_comm_plan_editor.html, avec les greffes liveryPos / payloadPos
//    et « skill = Player compte comme Client ».
const DCS_EXTRACTOR = (() => {

  // ── Utilitaires AST ──────────────────────────────────────────────────────
  function scalarVal(node) {
    if (!node) return undefined;
    if (node.kind==='number'||node.kind==='string'||node.kind==='bool'||node.kind==='ident') return node.value;
    if (node.kind==='nil') return null;
  }

  function get(tableNode, key) {
    if (!tableNode || tableNode.kind !== 'table') return undefined;
    for (const e of tableNode.entries) {
      if (!e.key) continue;
      if (typeof key === 'string' && (e.key.kind==='ident'||e.key.kind==='string') && e.key.value===key) return e.value;
      if (typeof key === 'number' && e.key.kind==='int' && e.key.value===key) return e.value;
    }
  }

  function posStr(pos) {
    if (!pos) return 'null';
    return `L${pos.start.line+1}:${pos.start.col}-${pos.end.col}@${pos.start.offset}`;
  }

  // Normaliser une signature pour comparaison : tableau trié de {radioIndex,channelNumber}
  function sigKey(syncPositions) {
    return JSON.stringify(
      syncPositions
        .map(s => ({ r: s.radioIndex, c: s.channelNumber }))
        .sort((a,b) => a.r !== b.r ? a.r - b.r : a.c - b.c)
    );
  }

  // ── Extraction Radio[N] ──────────────────────────────────────────────────
  function extractRadio(radioIndexEntry) {
    const idx   = radioIndexEntry.key ? radioIndexEntry.key.value : null;
    const rNode = radioIndexEntry.value;
    if (!rNode || rNode.kind !== 'table') return null;

    const chansNode = get(rNode, 'channels');
    const modsNode  = get(rNode, 'modulations');
    const namesNode = get(rNode, 'channelsNames');

    const channels = {};
    if (chansNode && chansNode.kind==='table' && chansNode.entries.length > 0) {
      for (const ce of chansNode.entries) {
        if (!ce.key || ce.key.kind !== 'int') continue;
        const num = ce.key.value;
        channels[num] = { number: num, frequency: ce.value.value, frequencyPos: ce.value.pos };
      }
    }

    let modulations = null;
    if (modsNode && modsNode.kind==='table' && modsNode.entries.length > 0) {
      modulations = {};
      for (const me of modsNode.entries) {
        if (!me.key || me.key.kind !== 'int') continue;
        modulations[me.key.value] = { value: me.value.value, pos: me.value.pos };
      }
    }

    let channelsNames = null;
    if (namesNode && namesNode.kind==='table' && namesNode.entries.length > 0) {
      channelsNames = {};
      for (const ne of namesNode.entries) {
        if (!ne.key || ne.key.kind !== 'int') continue;
        channelsNames[ne.key.value] = { value: ne.value.value, pos: ne.value.pos };
      }
    }

    return {
      index: idx,
      channels,
      channelsNames,
      modulations,
      blockPos:             rNode.pos,
      channelsBlockPos:     chansNode ? chansNode.pos : null,
      channelsNamesBlockPos:namesNode ? namesNode.pos : null,
      modulationsBlockPos:  modsNode  ? modsNode.pos  : null,
    };
  }

  // ── Calcul des positions de synchronisation pour un slot ─────────────────
  // Retourne [{ radioIndex, channelNumber, frequency, modulation, frequencyPos, modulationPos }]
  function computeSyncPositions(radios, groupFrequency) {
    if (!radios || groupFrequency === null || groupFrequency === undefined) return [];
    const gfreq = groupFrequency;
    const result = [];
    for (const radio of radios) {
      for (const [numStr, ch] of Object.entries(radio.channels)) {
        if (Math.abs(ch.frequency - gfreq) < 1e-9) {
          const chnum = Number(numStr);
          const modEntry = radio.modulations ? radio.modulations[chnum] : null;
          result.push({
            radioIndex:     radio.index,
            channelNumber:  chnum,
            frequency:      ch.frequency,
            frequencyPos:   ch.frequencyPos,
            modulation:     modEntry ? modEntry.value : null,
            modulationPos:  modEntry ? modEntry.pos   : null,
          });
        }
      }
    }
    // Tri canonique : par (radioIndex ASC, channelNumber ASC)
    result.sort((a,b) => a.radioIndex !== b.radioIndex ? a.radioIndex - b.radioIndex : a.channelNumber - b.channelNumber);
    return result;
  }

  // ── Extraction unité ─────────────────────────────────────────────────────
  function extractUnit(unitNode) {
    const radioTableNode = get(unitNode, 'Radio');
    let radios       = null;
    let radioBlockPos= null;

    if (radioTableNode && radioTableNode.kind==='table') {
      radioBlockPos = radioTableNode.pos;
      radios = [];
      for (const re of radioTableNode.entries) {
        const r = extractRadio(re);
        if (r) radios.push(r);
      }
      radios.sort((a,b) => a.index - b.index);
    }

    const callsignNode = get(unitNode, 'callsign');
    let callsign = null;
    if (callsignNode) {
      if (callsignNode.kind === 'table') {
        callsign = {};
        for (const ce of callsignNode.entries) {
          if (!ce.key) continue;
          callsign[ce.key.value] = scalarVal(ce.value);
        }
      } else { callsign = scalarVal(callsignNode); }
    }

    const liveryNode = get(unitNode, 'livery_id');
    return {
      unitId:       scalarVal(get(unitNode,'unitId')),
      name:         scalarVal(get(unitNode,'name')),
      type:         scalarVal(get(unitNode,'type')),
      skill:        scalarVal(get(unitNode,'skill')),
      callsign,
      livery_id:    liveryNode ? liveryNode.value : undefined,
      liveryPos:    liveryNode ? liveryNode.pos   : null,   // P3 — patch livrée
      payloadPos:   (() => { const pn = get(unitNode, 'payload'); return pn ? pn.pos : null; })(),  // P4 — patch payload
      radios,
      radioBlockPos,
      syncPositions: null, // calculé en second passage
    };
  }

  // ── Extraction groupe ─────────────────────────────────────────────────────
  function extractGroup(groupNode, coalitionKey, category) {
    const freqNode = get(groupNode,'frequency');
    const modNode  = get(groupNode,'modulation');
    const frequency = freqNode ? {
      value:         freqNode.value,
      modulation:    modNode ? modNode.value : null,
      valuePos:      freqNode.pos,
      modulationPos: modNode ? modNode.pos : null,
    } : null;

    const group = {
      groupId:                 scalarVal(get(groupNode,'groupId')),
      name:                    scalarVal(get(groupNode,'name')),
      task:                    scalarVal(get(groupNode,'task')),
      coalition:               coalitionKey,
      category,
      frequency,
      hasFrequencyAtGroupLevel: !!freqNode,
      groupBlockPos:           groupNode.pos,
    };

    const unitsNode = get(groupNode,'units');
    const clientUnits = [];
    if (unitsNode && unitsNode.kind==='table') {
      for (const ue of unitsNode.entries) {
        const skillNode = get(ue.value,'skill');
        if (skillNode && (skillNode.value==='Client' || skillNode.value==='Player')) clientUnits.push(extractUnit(ue.value));
      }
    }
    return { group, clientUnits };
  }

  // ── Second passage : calcul syncPositions + typeConventions ──────────────
  function computeSyncAndConventions(clientGroups) {
    // 1. Calcul syncPositions par slot
    for (const slot of clientGroups) {
      const gfreq = slot.group.frequency ? slot.group.frequency.value : null;
      slot.unit.syncPositions = slot.unit.radios
        ? computeSyncPositions(slot.unit.radios, gfreq)
        : null;
    }

    // 2. typeConventions : regrouper les slots avec Radio par type
    //    Slots sans Radio exclus du calcul
    const typeMap = {}; // type → [ sigKey, ... ]
    for (const slot of clientGroups) {
      if (!slot.unit.radios) continue; // sans Radio : exclure
      const tp = slot.unit.type;
      const sk = sigKey(slot.unit.syncPositions || []);
      if (!typeMap[tp]) typeMap[tp] = [];
      typeMap[tp].push({ sk, sig: slot.unit.syncPositions || [] });
    }

    const typeConventions = {};
    for (const [tp, entries] of Object.entries(typeMap)) {
      const keys = entries.map(e => e.sk);
      const distinct = [...new Set(keys)];
      const isUniform = distinct.length === 1;

      if (isUniform) {
        // Signature canonique : la liste de {radioIndex,channelNumber} du premier slot
        const canonical = entries[0].sig.map(s => ({
          radioIndex:    s.radioIndex,
          channelNumber: s.channelNumber,
        }));
        typeConventions[tp] = {
          syncSignature: canonical,
          isUniform: true,
          slotCount: entries.length,
        };
      } else {
        // Non uniforme : lister les variants
        const variantMap = {};
        for (const e of entries) {
          if (!variantMap[e.sk]) {
            variantMap[e.sk] = {
              count: 0,
              signature: e.sig.map(s => ({ radioIndex:s.radioIndex, channelNumber:s.channelNumber })),
            };
          }
          variantMap[e.sk].count++;
        }
        typeConventions[tp] = {
          syncSignature: null,
          isUniform: false,
          slotCount: entries.length,
          variants: Object.values(variantMap),
        };
      }
    }

    return typeConventions;
  }

  // ── Diagnostics ───────────────────────────────────────────────────────────
  function buildDiagnostics(clientGroups) {
    const diagnostics = [];

    for (const slot of clientGroups) {
      const { group, unit } = slot;

      // GROUP_FREQ_MISSING
      if (!group.hasFrequencyAtGroupLevel) {
        diagnostics.push({
          severity: 'warning',
          code:     'GROUP_FREQ_MISSING',
          message:  `Groupe "${group.name}" (groupId ${group.groupId}) — pas de ["frequency"] au niveau groupe.`,
        });
        continue;
      }

      // RADIO_BLOCK_MISSING
      if (!unit.radios) {
        diagnostics.push({
          severity: 'info',
          code:     'RADIO_BLOCK_MISSING',
          message:  `Unité "${unit.name}" (${unit.type}, groupId ${group.groupId}) — pas de bloc ["Radio"].`,
        });
        continue;
      }

      // EMPTY_RADIO_CHANNELS
      for (const r of unit.radios) {
        if (Object.keys(r.channels).length === 0) {
          diagnostics.push({
            severity: 'info',
            code:     'EMPTY_RADIO_CHANNELS',
            message:  `Unité "${unit.name}" (${unit.type}) — Radio[${r.index}].channels vide.`,
          });
        }
      }

      const sync  = unit.syncPositions || [];
      const gfreq = group.frequency.value;
      const modVal = group.frequency.modulation;
      const modStr = modVal === 0 ? 'AM' : modVal === 1 ? 'FM' : String(modVal);

      if (sync.length > 0) {
        // GROUP_FREQ_SYNC_DETECTED
        const lines = [
          `Groupe "${group.name}" (groupId ${group.groupId}), unité "${unit.name}" (${unit.type}) :`,
          `  group.frequency  @ ${posStr(group.frequency.valuePos)} = ${gfreq}`,
          `  group.modulation @ ${posStr(group.frequency.modulationPos)} = ${modVal} (${modStr})`,
        ];
        for (const sp of sync) {
          lines.push(`  ↔ Radio[${sp.radioIndex}].channels[${sp.channelNumber}] @ ${posStr(sp.frequencyPos)} = ${sp.frequency}`);
        }
        lines.push(`  (${sync.length} canal${sync.length > 1 ? 'x' : ''} synchronisé${sync.length > 1 ? 's' : ''})`);
        diagnostics.push({
          severity: 'info',
          code:     'GROUP_FREQ_SYNC_DETECTED',
          message:  lines.join('\n'),
        });
      } else {
        // GROUP_FREQ_NOT_IN_CHANNELS
        const radioSummary = unit.radios
          .map(r => `Radio[${r.index}] (${Object.keys(r.channels).length} canaux)`)
          .join(', ');
        diagnostics.push({
          severity: 'info',
          code:     'GROUP_FREQ_NOT_IN_CHANNELS',
          message:  [
            `Groupe "${group.name}", unité "${unit.name}" (${unit.type}) :`,
            `  group.frequency = ${gfreq} (n'est présente dans aucun canal radio)`,
            `  ${radioSummary} — aucun match`,
          ].join('\n'),
        });
      }
    }

    return diagnostics;
  }

  // ── Point d'entrée principal ──────────────────────────────────────────────
  function extract(ast, src, mizFilename, otherFilesMap, precomputedLines) {
    const missionTable = ast.kind==='assignment' ? ast.value : ast;
    const lines        = precomputedLines || src.split('\n');
    const clientGroups = [];

    const coalNode = get(missionTable,'coalition');
    if (coalNode) {
      for (const coalKey of ['blue','red','neutrals']) {
        const coalSide   = get(coalNode, coalKey);     if (!coalSide)   continue;
        const countryTbl = get(coalSide, 'country');   if (!countryTbl || countryTbl.kind!=='table') continue;

        for (const ce of countryTbl.entries) {
          for (const category of ['helicopter','plane']) {
            const catNode   = get(ce.value, category); if (!catNode)   continue;
            const groupList = get(catNode,  'group');  if (!groupList || groupList.kind!=='table') continue;

            for (const ge of groupList.entries) {
              const { group, clientUnits } = extractGroup(ge.value, coalKey, category);
              for (const unit of clientUnits) {
                clientGroups.push({ coalition: coalKey, category, group, unit });
              }
            }
          }
        }
      }
    }

    // Second passage : sync positions + type conventions
    const typeConventions = computeSyncAndConventions(clientGroups);

    // Diagnostics
    const diagnostics = buildDiagnostics(clientGroups);

    // otherFiles : map filename → { size, data:Uint8Array }
    // Les données brutes sont dans otherFilesMap (passé depuis le harness)
    const otherFilesSummary = otherFilesMap
      ? Object.fromEntries(
          Object.entries(otherFilesMap).map(([name, data]) => [name, { size: data.length }])
        )
      : null;

    return {
      source: {
        _text:  src,    // usage interne — non sérialisé
        _lines: lines,
        summary: { textLength: src.length, lineCount: lines.length },
        miz: {
          filename:   mizFilename,
          otherFiles: otherFilesSummary, // { filename: { size } }
          _otherFilesData: otherFilesMap, // Uint8Arrays bruts pour v1.0.0
        },
      },
      clientGroups,
      typeConventions,
      diagnostics,
    };
  }

  // ── Sérialisation display (omit champs _, tronquer pos) ──────────────────
  function serialize(model, limit) {
    const slots = limit != null ? model.clientGroups.slice(0, limit) : model.clientGroups;
    function shortenPos(pos) {
      if (!pos) return null;
      return `L${pos.start.line+1}:${pos.start.col}-${pos.end.col}@${pos.start.offset}`;
    }
    function process(obj, depth) {
      if (depth > 12 || obj === null || obj === undefined) return obj;
      if (typeof obj !== 'object') return obj;
      if (obj.start && obj.end && 'offset' in obj.start) return shortenPos(obj);
      if (Array.isArray(obj)) return obj.map(v => process(v, depth+1));
      const out = {};
      for (const [k,v] of Object.entries(obj)) {
        if (k.startsWith('_')) continue;
        out[k] = process(v, depth+1);
      }
      return out;
    }
    return JSON.stringify(slots.map(s => process(s, 0)), null, 2);
  }

  function serializeTypeConventions(model) {
    function process(obj, depth) {
      if (depth > 6 || obj === null || obj === undefined) return obj;
      if (typeof obj !== 'object') return obj;
      if (obj.start && obj.end && 'offset' in obj.start) return `L${obj.start.line+1}:${obj.start.col}@${obj.start.offset}`;
      if (Array.isArray(obj)) return obj.map(v => process(v, depth+1));
      const out = {};
      for (const [k,v] of Object.entries(obj)) { if (!k.startsWith('_')) out[k] = process(v, depth+1); }
      return out;
    }
    return JSON.stringify(process(model.typeConventions, 0), null, 2);
  }

  return { extract, serialize, serializeTypeConventions, posStr };
})();

// ── Sérialiseur Lua — copié à l'identique du projet frère Mission Plan (build_hq.py).
//    luaEscape et luaKey sont les deux aides de serializeLua.
function astToValue(node) {
  if (!node) return undefined;
  if (node.kind === 'number' || node.kind === 'string' || node.kind === 'bool' || node.kind === 'ident')
    return node.value;
  if (node.kind === 'nil') return null;
  if (node.kind === 'table') {
    const obj = {};
    for (const e of node.entries) {
      if (!e.key) continue;
      const v = astToValue(e.value);
      if (v !== undefined) obj[e.key.value] = v;
    }
    return obj;
  }
  return undefined;
}

function formatLuaNumber(n) {
  return String(n);
}

function luaEscape(str) {
  let out = '';
  for (const ch of String(str)) {
    const c = ch.codePointAt(0);
    if (ch === '\\') out += '\\\\';
    else if (ch === '"') out += '\\"';
    else if (ch === '\n') out += '\\n';
    else if (ch === '\r') out += '\\r';
    else if (c < 32) out += '\\' + String(c).padStart(3, '0');
    else out += ch;
  }
  return out;
}

function luaKey(k) {
  const ks = String(k);
  return /^\d+$/.test(ks) ? '[' + ks + ']' : '["' + luaEscape(ks) + '"]';
}

function serializeLua(val, indent) {
  indent = (indent === undefined) ? 0 : indent;
  const tab  = '\t'.repeat(indent);
  const tab1 = '\t'.repeat(indent + 1);
  if (val === null || val === undefined) return null;
  if (typeof val === 'boolean') return val ? 'true' : 'false';
  if (typeof val === 'number') return isFinite(val) ? formatLuaNumber(val) : null;
  if (typeof val === 'string') return '"' + luaEscape(val) + '"';
  if (typeof val !== 'object') return null;
  const entries = Object.entries(val);
  if (entries.length === 0) return '{}';
  let out = '{\n';
  for (const [k, v] of entries) {
    const vs = serializeLua(v, indent + 1);
    if (vs === null) continue;
    const ks = luaKey(k);
    out += tab1 + ks + ' = ' + vs + ', -- end of ' + ks + '\n';
  }
  out += tab + '}';
  return out;
}

// luaTableReproducible : true si serializeLua(astToValue(node)) redonne la même table, en valeur.
// Faux dès qu'à une profondeur quelconque : une entrée sans clé, une clé texte faite uniquement de chiffres,
// une clé ni texte ni nombre (ou un nombre qui n'est pas un entier ≥ 0), une clé en double, ou une valeur
// que astToValue ne sait pas rendre (identifiant nu, nil).
function luaTableReproducible(node) {
  if (!node) return false;
  if (node.kind === 'table') {
    const seen = new Set();
    for (const e of node.entries) {
      if (!e.key) return false;
      let ks;
      if (e.key.kind === 'string') {
        ks = String(e.key.value);
        if (/^\d+$/.test(ks) || ks === '__proto__') return false;
      } else if (e.key.kind === 'int') {
        ks = String(e.key.value);
        if (typeof e.key.value !== 'number' || !/^\d+$/.test(ks)) return false;
      } else {
        return false;
      }
      if (seen.has(ks)) return false;
      seen.add(ks);
      if (!luaTableReproducible(e.value)) return false;
    }
    return true;
  }
  return node.kind === 'number' || node.kind === 'string' || node.kind === 'bool';
}

function deepEqValues(a, b) {
  if (a === null && b === null) return true;
  if (typeof a !== typeof b) return false;
  if (typeof a === 'number') return Math.abs(a - b) / (Math.abs(a) + 1e-10) < 1e-9;
  if (typeof a !== 'object') return a === b;
  if (a === null || b === null) return a === b;
  const ka = Object.keys(a).sort(), kb = Object.keys(b).sort();
  if (JSON.stringify(ka) !== JSON.stringify(kb)) return false;
  return ka.every(k => deepEqValues(a[k], b[k]));
}

// ═══════════════════════════════════════════════════════════════
// PARCOURS DES APPAREILS — code neuf
// Tous les avions et hélicoptères de chaque groupe, joueurs et IA (l'extracteur du
// Comm Plan ne garde que les joueurs). Pour chacun : coalition, pays, catégorie, groupe,
// nom, unitId, type, rôle, livrée et sa position, emport (valeur) et sa position.
// ═══════════════════════════════════════════════════════════════
function lxGet(tableNode, key) {
  if (!tableNode || tableNode.kind !== 'table') return undefined;
  for (const e of tableNode.entries) {
    if (!e.key) continue;
    if (typeof key === 'string' && (e.key.kind === 'ident' || e.key.kind === 'string') && e.key.value === key) return e.value;
    if (typeof key === 'number' && e.key.kind === 'int' && e.key.value === key) return e.value;
  }
  return undefined;
}

function lxScalar(node) {
  if (!node) return undefined;
  if (node.kind === 'number' || node.kind === 'string' || node.kind === 'bool' || node.kind === 'ident') return node.value;
  return undefined;
}

function lxWalkAircraft(ast) {
  const mission = ast.kind === 'assignment' ? ast.value : ast;
  const out = [];
  const coalNode = lxGet(mission, 'coalition');
  if (!coalNode) return out;
  for (const coalKey of ['blue', 'red', 'neutrals']) {
    const side = lxGet(coalNode, coalKey);
    if (!side) continue;
    const countries = lxGet(side, 'country');
    if (!countries || countries.kind !== 'table') continue;
    for (const ce of countries.entries) {
      const country = lxScalar(lxGet(ce.value, 'name'));
      for (const category of ['plane', 'helicopter']) {
        const catNode = lxGet(ce.value, category);
        if (!catNode) continue;
        const groups = lxGet(catNode, 'group');
        if (!groups || groups.kind !== 'table') continue;
        for (const ge of groups.entries) {
          const groupNode = ge.value;
          const groupName = lxScalar(lxGet(groupNode, 'name'));
          const groupId = lxScalar(lxGet(groupNode, 'groupId'));
          const units = lxGet(groupNode, 'units');
          if (!units || units.kind !== 'table') continue;
          for (const ue of units.entries) {
            const un = ue.value;
            if (!un || un.kind !== 'table') continue;
            const skill = lxScalar(lxGet(un, 'skill'));
            const liveryNode = lxGet(un, 'livery_id');
            const payloadNode = lxGet(un, 'payload');
            out.push({
              unitId:     lxScalar(lxGet(un, 'unitId')),
              name:       lxScalar(lxGet(un, 'name')),
              type:       lxScalar(lxGet(un, 'type')),
              coalition:  coalKey,
              country,
              category,
              groupId,
              groupName,
              skill,
              role:       (skill === 'Client' || skill === 'Player') ? 'player' : 'ai',
              livery:     (liveryNode && liveryNode.kind === 'string') ? liveryNode.value : undefined,
              liveryPos:  (liveryNode && liveryNode.kind === 'string') ? liveryNode.pos : null,
              payload:    payloadNode ? astToValue(payloadNode) : undefined,
              payloadPos: payloadNode ? payloadNode.pos : null,
              payloadTable: !!(payloadNode && payloadNode.kind === 'table'),
              reproducible: !!(payloadNode && payloadNode.kind === 'table' && luaTableReproducible(payloadNode)),
            });
          }
        }
      }
    }
  }
  return out;
}

function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function lxClone(v) { return JSON.parse(JSON.stringify(v)); }

// A, B … Z, AA, AB …
function lxLetters(n) {
  let s = '';
  n = n + 1;
  while (n > 0) { n--; s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26); }
  return s;
}

function lxNorm(s) {
  return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}

// ═══════════════════════════════════════════════════════════════
// VALEURS COURANTES, EMPORTS ET LIVRÉES DISTINCTS
// ═══════════════════════════════════════════════════════════════
function curPayload(u) {
  const e = UI_STATE.edits.get(u.unitId);
  return (e && e.payload !== undefined) ? e.payload : u.payload;
}
function curLivery(u) {
  const e = UI_STATE.edits.get(u.unitId);
  return (e && e.livery !== undefined) ? e.livery : u.livery;
}

function cachedBy(key, build) {
  const c = UI_STATE._cache.get(key);
  if (c && c.rev === UI_STATE.rev) return c.value;
  const value = build();
  UI_STATE._cache.set(key, { rev: UI_STATE.rev, value });
  return value;
}

// Nom d'une arme : tiré de pydcs ; un CLSID absent de la table s'affiche tel quel.
function weaponName(clsid) {
  const n = Object.prototype.hasOwnProperty.call(WEAPON_NAMES, clsid) ? WEAPON_NAMES[clsid] : undefined;
  return n === undefined ? String(clsid) : n;
}

// Un emport, ce sont ses pylônes : les mêmes CLSID aux mêmes numéros.
function loadoutSig(payload) {
  const py = payload && payload.pylons;
  if (!py || typeof py !== 'object') return '';
  return Object.keys(py).sort((a, b) => Number(a) - Number(b)).map(k => k + '=' + (py[k] && py[k].CLSID !== undefined ? py[k].CLSID : '')).join('|');
}

// Les emports d'un type reçoivent leur lettre à l'ouverture du fichier (A, B, C… par nombre d'appareils
// décroissant, puis ordre de la liste) ; elles ne changent plus jusqu'au prochain fichier ouvert.
function buildLoadoutDefs() {
  const defs = new Map();
  for (const [type, units] of UI_STATE.byType) {
    const ordered = units.filter(u => u.reproducible && u.payloadTable)
      .slice().sort((a, b) => natCompare(a.groupName, b.groupName) || natCompare(a.name, b.name));
    const list = [];
    for (const u of ordered) {
      const sig = loadoutSig(u.payload);
      let d = list.find(x => x.sig === sig);
      if (!d) { d = { sig, source: lxClone(u.payload), n0: 0, order: list.length }; list.push(d); }
      d.n0++;
    }
    list.sort((a, b) => (b.n0 - a.n0) || (a.order - b.order));
    list.forEach((d, i) => { d.letter = lxLetters(i); });
    defs.set(type, list);
  }
  UI_STATE.loadoutDefs = defs;
}

// Cartes d'emport d'un type avec leur nombre d'appareils actuel, et la lettre de chaque appareil
// (d'origine et actuelle).
function getLoadouts(type) {
  return cachedBy('ld:' + type, () => {
    const defs = (UI_STATE.loadoutDefs.get(type) || []).map(d => ({ letter: d.letter, sig: d.sig, source: d.source, count: 0 }));
    const bySig = new Map(defs.map(d => [d.sig, d]));
    const cur = new Map(), orig = new Map();
    for (const u of (UI_STATE.byType.get(type) || [])) {
      if (!u.reproducible || !u.payloadTable) continue;   // payload non reproductible : hors des emports du type
      const dc = bySig.get(loadoutSig(curPayload(u)));
      const dof = bySig.get(loadoutSig(u.payload));
      if (dc) { dc.count++; cur.set(u.unitId, dc.letter); }
      if (dof) orig.set(u.unitId, dof.letter);
    }
    return { list: defs, cur, orig };
  });
}

// Deux livery_id qui ne diffèrent que par la casse sont la même livrée.
function liveryEq(a, b) {
  return a !== undefined && b !== undefined && String(a).toLowerCase() === String(b).toLowerCase();
}

// Livrées distinctes d'un type : une carte par couple (pays, livrée sans la casse), nombre cumulé,
// affichée sous la forme la plus fréquente (à égalité, la plus ancienne dans la liste).
function getLiveries(type) {
  return cachedBy('lv:' + type, () => {
    const map = new Map();
    for (const u of (UI_STATE.byType.get(type) || [])) {
      const lv = curLivery(u);
      if (lv === undefined) continue;
      const key = u.country + '\u0000' + String(lv).toLowerCase();
      let e = map.get(key);
      if (!e) { e = { key, country: u.country, forms: new Map(), count: 0 }; map.set(key, e); }
      e.forms.set(lv, (e.forms.get(lv) || 0) + 1);
      e.count++;
    }
    const out = [...map.values()];
    for (const e of out) {
      let best = null, bn = -1;
      for (const [f, n] of e.forms) if (n > bn) { best = f; bn = n; }
      e.livery = best;
    }
    return out.sort((a, b) => (b.count - a.count) || String(a.livery).localeCompare(String(b.livery)) || String(a.country).localeCompare(String(b.country)));
  });
}

// ═══════════════════════════════════════════════════════════════
// MODIFICATIONS
// ═══════════════════════════════════════════════════════════════
function touchEdit(u, mutate) {
  const e = UI_STATE.edits.get(u.unitId) || {};
  mutate(e);
  if (e.payload !== undefined && u.payload !== undefined && deepEqValues(e.payload, u.payload)) delete e.payload;
  if (e.livery !== undefined && e.livery === u.livery) delete e.livery;
  if (Object.keys(e).length === 0) UI_STATE.edits.delete(u.unitId);
  else UI_STATE.edits.set(u.unitId, e);
  UI_STATE.rev++;
}

function setPayload(u, value) { touchEdit(u, e => { e.payload = value; }); }
function setLivery(u, value)  { touchEdit(u, e => { e.livery = value; }); }

// Le type du panneau : celui de la première case cochée
function panelType() {
  for (const id of UI_STATE.selected) {
    const u = UI_STATE.byId.get(id);
    if (u) return u.type;
  }
  return null;
}

// Résumé de toast : « 15 appareils modifiés, 3 ignorés : autre type »
function resultToast(modified, ignored) {
  const total = Object.values(ignored).reduce((a, b) => a + b, 0);
  let msg = tn('toast.modified', modified);
  if (total > 0) {
    const reasons = Object.entries(ignored).filter(([, n]) => n > 0);
    const why = reasons.length === 1
      ? t('reason.' + reasons[0][0])
      : reasons.map(([k, n]) => t('reason.' + k) + ' (' + n + ')').join(', ');
    msg += ', ' + tn('toast.ignored', total) + t('toast.sep') + why;
  }
  showToast(msg, modified > 0 ? 'success' : 'warn');
}

function afterEdit() {
  renderAll();
}

// Motif pour lequel un appareil coché ne prend pas une modification (null : il la prend).
// kind : 'payload' (emport, réglages) ou 'livery'.
function skipReason(u, type, visSet, kind, country) {
  if (u.type !== type) return 'type';
  if (!visSet.has(u.unitId)) return 'hidden';
  if (UI_STATE.dupIds.has(u.unitId)) return 'duplicate';
  if (kind === 'payload') {
    if (u.payloadPos === null || !u.payloadTable) return 'noPayload';
    if (!u.reproducible) return 'notRepro';
  } else {
    if (u.country !== country) return 'country';
    if (u.liveryPos === null) return 'noLivery';
  }
  return null;
}

// Appareils que « Appliquer l'emport » modifierait : cochés, visibles, du même type, qui n'ont pas déjà cet emport.
function loadoutTargets(type, def) {
  const visSet = new Set(UI_STATE.filtered.map(x => x.unitId));
  const out = [];
  for (const u of UI_STATE.aircraft) {
    if (!UI_STATE.selected.has(u.unitId)) continue;
    if (skipReason(u, type, visSet, 'payload')) continue;
    if (loadoutSig(curPayload(u)) === def.sig) continue;
    out.push(u);
  }
  return out;
}

// Appareils que « Appliquer la livrée » modifierait : cochés, visibles, du même type et du même pays,
// qui ne portent pas déjà cette livrée (casse comprise dans « même livrée »).
function liveryTargets(type, entry) {
  const visSet = new Set(UI_STATE.filtered.map(x => x.unitId));
  const out = [];
  for (const u of UI_STATE.aircraft) {
    if (!UI_STATE.selected.has(u.unitId)) continue;
    if (skipReason(u, type, visSet, 'livery', entry.country)) continue;
    if (liveryEq(curLivery(u), entry.livery)) continue;
    out.push(u);
  }
  return out;
}

// Un emport recopie pylons, et ammo_type et restricted quand la source les porte ;
// carburant, leurres, paillettes et canon relèvent des Réglages.
function payloadWithLoadout(current, def) {
  const next = lxClone(current);
  next.pylons = lxClone(def.source.pylons || {});
  if (def.source.ammo_type !== undefined) next.ammo_type = def.source.ammo_type;
  if (def.source.restricted !== undefined) next.restricted = lxClone(def.source.restricted);
  return next;
}

function applyLoadoutToSelection(letter) {
  const type = panelType();
  if (type === null) return;
  const def = (UI_STATE.loadoutDefs.get(type) || []).find(d => d.letter === letter);
  if (!def) return;
  let modified = 0;
  const ignored = {};
  const visSet = new Set(UI_STATE.filtered.map(x => x.unitId));
  for (const u of UI_STATE.aircraft) {
    if (!UI_STATE.selected.has(u.unitId)) continue;
    const why = skipReason(u, type, visSet, 'payload');
    if (why) { ignored[why] = (ignored[why] || 0) + 1; continue; }
    if (loadoutSig(curPayload(u)) === def.sig) continue;   // déjà cet emport : ni modifié ni ignoré
    setPayload(u, payloadWithLoadout(curPayload(u), def));
    modified++;
  }
  afterEdit();
  resultToast(modified, ignored);
}

function readSettings() {
  const defs = [
    { id: 'set-fuel',  key: 'fuel',  label: t('panel.fuel'),   int: false, max: Infinity },
    { id: 'set-flare', key: 'flare', label: t('panel.flares'), int: true,  max: Infinity },

    { id: 'set-gun',   key: 'gun',   label: t('panel.gun'),    int: true,  max: 100 },
  ];
  const out = {};
  for (const d of defs) {
    const el = document.getElementById(d.id);
    if (el.validity && el.validity.badInput) {   // saisie illisible : le champ « vide » n'est pas vide
      showToast(t('toast.badValue').replace('{field}', d.label), 'error');
      return null;
    }
    const raw = el.value.trim();
    if (raw === '') continue;
    const n = Number(raw);
    if (!isFinite(n) || n < 0 || n > d.max || (d.int && !Number.isInteger(n))) {
      showToast(t('toast.badValue').replace('{field}', d.label), 'error');
      return null;
    }
    out[d.key] = n;
  }
  if (Object.keys(out).length === 0) { showToast(t('toast.noSettings'), 'warn'); return null; }
  return out;
}

function applySettingsToSelection() {
  const type = panelType();
  if (type === null) return;
  const settings = readSettings();
  if (!settings) return;
  let modified = 0;
  const ignored = {};
  const visSet = new Set(UI_STATE.filtered.map(x => x.unitId));
  for (const u of UI_STATE.aircraft) {
    if (!UI_STATE.selected.has(u.unitId)) continue;
    const why = skipReason(u, type, visSet, 'payload');
    if (why) { ignored[why] = (ignored[why] || 0) + 1; continue; }
    const next = lxClone(curPayload(u));
    for (const [k, v] of Object.entries(settings)) next[k] = v;
    if (deepEqValues(curPayload(u), next)) continue;
    setPayload(u, next);
    modified++;
  }
  afterEdit();
  resultToast(modified, ignored);
}

function applyLiveryToSelection(country, livery) {
  const type = panelType();
  if (type === null) return;
  let modified = 0;
  const ignored = {};
  const visSet = new Set(UI_STATE.filtered.map(x => x.unitId));
  for (const u of UI_STATE.aircraft) {
    if (!UI_STATE.selected.has(u.unitId)) continue;
    const why = skipReason(u, type, visSet, 'livery', country);
    if (why) { ignored[why] = (ignored[why] || 0) + 1; continue; }
    if (liveryEq(curLivery(u), livery)) continue;
    setLivery(u, livery);
    modified++;
  }
  afterEdit();
  resultToast(modified, ignored);
}

function setModel(model) {
  UI_STATE.model = model;
  UI_STATE.aircraft = model.aircraft;
  UI_STATE.byId = new Map(model.aircraft.map(u => [u.unitId, u]));
  const byType = new Map();
  for (const u of model.aircraft) {
    if (!byType.has(u.type)) byType.set(u.type, []);
    byType.get(u.type).push(u);
  }
  UI_STATE.byType = byType;
  UI_STATE.rev++;
  UI_STATE._cache.clear();
}

async function loadMiz(file) {
  showSpinner(t('spinner.parsing'));
  try {
    const arrayBuffer = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(arrayBuffer);

    // Lire mission
    const missionEntry = zip.file('mission');
    if (!missionEntry) throw new Error('Fichier "mission" introuvable dans le .miz');
    const missionSrc = await missionEntry.async('string');

    // Conserver les autres fichiers
    const otherFilesMap = {};
    for (const [name, entry] of Object.entries(zip.files)) {
      if (name === 'mission' || entry.dir) continue;
      otherFilesMap[name] = await entry.async('uint8array');
    }

    await new Promise(r => setTimeout(r, 0)); // yield pour afficher le spinner

    const t0 = performance.now();
    const { tokens, errors: tokErrors } = DCS_TOKENIZER.tokenize(missionSrc);
    if (tokErrors.length > 0) throw new Error('Tokenizer : ' + tokErrors[0].message + ' L' + (tokErrors[0].line + 1));
    const ast = DCS_PARSER.parse(tokens);

    const extracted = DCS_EXTRACTOR.extract(ast, missionSrc, file.name, otherFilesMap, missionSrc.split('\n'));
    const aircraft = lxWalkAircraft(ast);
    const nPlayers = aircraft.filter(u => u.role === 'player').length;
    if (nPlayers !== extracted.clientGroups.length) {
      console.warn('[Load] Joueurs : parcours', nPlayers, '≠ extracteur', extracted.clientGroups.length);
    }
    console.log('[Load] Parse OK en', Math.round(performance.now() - t0), 'ms — appareils :', aircraft.length);

    // unitId en double (ou absent) : ces appareils ne prennent aucune modification
    const idCount = new Map();
    for (const u of aircraft) idCount.set(u.unitId, (idCount.get(u.unitId) || 0) + 1);
    const dupIds = new Set();
    for (const [id, n] of idCount) if (n > 1 || id === undefined) dupIds.add(id);
    const dupUnits = aircraft.filter(u => dupIds.has(u.unitId)).length;

    _HQ_MIZ_CONTEXT = { otherFilesMap };
    UI_STATE.dupIds = dupIds;
    UI_STATE.tab = 'list';
    UI_STATE.edits = new Map();
    UI_STATE.selected = new Set();
    UI_STATE.collapsed = new Set();
    UI_STATE.filters = { coalition: '', type: '', role: '', search: '' };
    UI_STATE.showModifiedOnly = false;
    setModel({ source: extracted.source, aircraft });
    buildLoadoutDefs();
    UI_STATE.choice = { type: null, loadout: null, livery: null };
    resetFilterControls();

    renderAll();
    document.getElementById('drop-zone').classList.add('hidden');
    document.getElementById('main-ui').classList.remove('hidden');
    document.getElementById('modifications-bar').classList.remove('hidden');

    const hdrMiz = document.getElementById('header-miz');
    hdrMiz.textContent = file.name;
    hdrMiz.classList.remove('empty');

    const loadedMsg = t('toast.loaded').replace('{n}', aircraft.length).replace('{file}', file.name);
    if (dupUnits > 0) showToast(loadedMsg + '\n' + t('toast.duplicates').replace('{n}', dupUnits), 'warn');
    else showToast(loadedMsg, 'success');
  } catch (err) {
    console.error('[Load] Erreur :', err);
    showToast(t('toast.loadError') + ' ' + err.message, 'error');
  } finally {
    hideSpinner();
  }
}

function buildTypeFilter() {
  const sel = document.getElementById('filter-type');
  const cur = UI_STATE.filters.type;
  const types = [...UI_STATE.byType.keys()].sort((a, b) => String(a).localeCompare(String(b)));
  let html = '<option value="">' + escHtml(t('filter.type.all')) + '</option>';
  for (const tp of types) {
    html += '<option value="' + escHtml(tp) + '">' + escHtml(tp) + ' (' + UI_STATE.byType.get(tp).length + ')</option>';
  }
  sel.innerHTML = html;
  sel.value = types.includes(cur) ? cur : '';
  if (sel.value !== cur) UI_STATE.filters.type = sel.value;
}

function filteredAircraft() {
  const f = UI_STATE.filters;
  const q = lxNorm(f.search.trim());
  return UI_STATE.aircraft.filter(u => {
    if (f.coalition && u.coalition !== f.coalition) return false;
    if (f.type && u.type !== f.type) return false;
    if (f.role && u.role !== f.role) return false;
    if (q && !(lxNorm(u.groupName).includes(q) || lxNorm(u.name).includes(q))) return false;
    if (UI_STATE.showModifiedOnly && !UI_STATE.edits.has(u.unitId)) return false;
    return true;
  });
}
