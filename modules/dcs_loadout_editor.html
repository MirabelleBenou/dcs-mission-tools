function natCompare(a, b) {
  return String(a == null ? '' : a).localeCompare(String(b == null ? '' : b), undefined, { numeric: true, sensitivity: 'base' });
}

function renderTable() {
  const rows = filteredAircraft();
  UI_STATE.filtered = rows;

  // Groupé par type
  const groups = new Map();
  for (const u of rows) {
    if (!groups.has(u.type)) groups.set(u.type, []);
    groups.get(u.type).push(u);
  }
  const types = [...groups.keys()].sort((a, b) => natCompare(a, b));

  let html = '';
  for (const tp of types) {
    const list = groups.get(tp).slice().sort((a, b) => natCompare(a.groupName, b.groupName) || natCompare(a.name, b.name));
    const selN = list.filter(u => UI_STATE.selected.has(u.unitId)).length;
    const collapsed = UI_STATE.collapsed.has(tp);
    const total = UI_STATE.byType.get(tp).length;
    const nPlayers = list.filter(u => u.role === 'player').length;
    html += '<tr class="row-type" data-type="' + escHtml(tp) + '"><td class="td-chk">' +
      '<input type="checkbox" class="type-chk" data-type="' + escHtml(tp) + '" title="' + escHtml(t('table.checkType')) + '"' +
        (selN === list.length ? ' checked' : '') + (selN > 0 && selN < list.length ? ' data-indeterminate="1"' : '') + '>' +
      '</td><td colspan="' + (narrowMQ.matches ? 4 : 6) + '"><div class="type-head">' +
      '<button class="type-caret" data-type="' + escHtml(tp) + '" title="' + escHtml(t('table.collapse')) + '">' + (collapsed ? '▸' : '▾') + '</button>' +
      '<span class="type-name">' + escHtml(tp) + '</span>' +
      '<span class="type-meta">' + escHtml(tn('table.type.count', list.length, list.length === total ? total : list.length + ' / ' + total)) +
        ' · ' + escHtml(t('role.player')) + ' ' + nPlayers + ' · ' + escHtml(t('role.ai')) + ' ' + (list.length - nPlayers) + '</span>' +
      '</div></td></tr>';
    if (collapsed) continue;
    const ldInfo = getLoadouts(tp);
    for (const u of list) {
      const ed = UI_STATE.edits.get(u.unitId);
      const pChanged = !!(ed && ed.payload !== undefined);
      const lChanged = !!(ed && ed.livery !== undefined);
      const lv = curLivery(u);
      const roleTxt = t(u.role === 'player' ? 'role.player' : 'role.ai');
      html += '<tr class="row-unit' + (ed ? ' row-modified' : '') + '" data-id="' + u.unitId + '">' +
        '<td class="td-chk"><input type="checkbox" class="row-chk" data-id="' + u.unitId + '"' + (UI_STATE.selected.has(u.unitId) ? ' checked' : '') + '></td>' +
        '<td class="c-group">' + escHtml(u.groupName) + '</td>' +
        '<td class="c-unit">' + escHtml(u.name) +
          '<span class="narrow-only">' + escHtml(roleTxt) + ' · ' + escHtml(u.country) + '</span></td>' +
        '<td class="c-role"><span class="role-badge role-' + u.role + '">' + escHtml(roleTxt) + '</span></td>' +
        '<td class="c-country"><span class="coal-dot ' + u.coalition + '"></span>' + escHtml(u.country) + '</td>' +
        '<td class="td-ld cell-loadout">' + (ldInfo.cur.has(u.unitId)
          ? '<span class="ld-badge' + (ldInfo.orig.get(u.unitId) !== ldInfo.cur.get(u.unitId) ? ' changed ld-arrow' : (pChanged ? ' changed' : '')) + '">' +
              escHtml(ldInfo.orig.get(u.unitId) !== ldInfo.cur.get(u.unitId) ? (ldInfo.orig.get(u.unitId) || '—') + ' → ' + ldInfo.cur.get(u.unitId) : ldInfo.cur.get(u.unitId)) + '</span>'
          : (u.payloadTable && !u.reproducible
              ? '<span class="ld-badge warn" title="' + escHtml(t('table.notRepro')) + '">!</span>'
              : '<span class="ld-badge">—</span>')) +
          (ed ? '<button class="btn-undo-cell" data-id="' + u.unitId + '" title="' + escHtml(t('table.undo')) + '">↺</button>' : '') + '</td>' +
        '<td class="c-livery cell-livery' + (lChanged ? ' changed' : '') + '">' +
          (lv === undefined ? '<span class="none">' + escHtml(t('livery.none')) + '</span>' : escHtml(lv)) + '</td>' +
        '</tr>';
    }
  }
  document.getElementById('units-tbody').innerHTML = html;
  document.querySelectorAll('.type-chk[data-indeterminate]').forEach(c => { c.indeterminate = true; });
  document.getElementById('empty-state').style.display = rows.length === 0 ? 'block' : 'none';
  document.getElementById('units-table').style.display = rows.length === 0 ? 'none' : '';
  updateHeaderChk();
}

function updateHeaderChk() {
  const chkAll = document.getElementById('chk-all');
  const vis = UI_STATE.filtered;
  const n = vis.filter(u => UI_STATE.selected.has(u.unitId)).length;
  chkAll.checked = vis.length > 0 && n === vis.length;
  chkAll.indeterminate = n > 0 && n < vis.length;
}

function renderPanel() {
  const panel = document.getElementById('type-panel');
  const type = panelType();
  const tabPanel = document.getElementById('tab-panel');
  tabPanel.disabled = (type === null);
  if (type === null) { panel.classList.add('hidden'); if (UI_STATE.tab === 'panel') UI_STATE.tab = 'list'; showTab(); return; }
  panel.classList.remove('hidden');
  showTab();

  const all = UI_STATE.byType.get(type) || [];
  document.getElementById('panel-type').textContent = type + ' · ' + tn('panel.count', all.length);
  let same = 0, other = 0;
  for (const id of UI_STATE.selected) {
    const u = UI_STATE.byId.get(id);
    if (!u) continue;
    if (u.type === type) same++; else other++;
  }
  const canApply = same > 0;
  document.getElementById('panel-sel').innerHTML = escHtml(t('panel.sel.same').replace('{n}', same)) +
    (other > 0 ? ' · <span class="warn">' + escHtml(t('panel.sel.other').replace('{n}', other)) + '</span>' : '');

  // Choix : valable pour le type du panneau seulement
  if (UI_STATE.choice.type !== type) UI_STATE.choice = { type, loadout: null, livery: null };

  // Emports : une carte par emport, désigné par ses pylônes (nom de l'arme)
  const { list } = getLoadouts(type);
  if (UI_STATE.choice.loadout && !list.some(e => e.letter === UI_STATE.choice.loadout)) UI_STATE.choice.loadout = null;
  let html = '';
  for (const e of list) {
    const py = (e.source.pylons && typeof e.source.pylons === 'object') ? e.source.pylons : {};
    const keys = Object.keys(py).sort((a, b) => Number(a) - Number(b));
    const pyl = keys.length
      ? keys.map(k => '<div><span class="pn">' + escHtml(k) + ' — </span>' + escHtml(py[k] && py[k].CLSID !== undefined ? weaponName(py[k].CLSID) : '?') + '</div>').join('')
      : '<div class="none">' + escHtml(t('panel.noPylons')) + '</div>';
    const chosen = UI_STATE.choice.loadout === e.letter;
    html += '<div class="ld-card' + (chosen ? ' chosen' : '') + '" data-letter="' + escHtml(e.letter) + '" role="button" tabindex="0" aria-pressed="' + chosen + '">' +
      '<div class="ld-card-top"><span class="ld-badge">' + escHtml(e.letter) + '</span>' +
        '<span class="ld-count">' + escHtml(tn('panel.count', e.count)) + '</span></div>' +
      '<div class="ld-pylons">' + pyl + '</div>' +
      '</div>';
  }
  document.getElementById('panel-loadouts').innerHTML = html || '<div class="none">' + escHtml(t('panel.noLoadouts')) + '</div>';

  // Livrées
  const lvs = getLiveries(type);
  if (UI_STATE.choice.livery && !lvs.some(e => e.key === UI_STATE.choice.livery)) UI_STATE.choice.livery = null;
  let lhtml = '';
  lvs.forEach((e, i) => {
    const chosen = UI_STATE.choice.livery === e.key;
    lhtml += '<div class="lv-card' + (chosen ? ' chosen' : '') + '" data-index="' + i + '" role="button" tabindex="0" aria-pressed="' + chosen + '">' +
      '<div class="lv-card-top"><span class="lv-dot"></span><div class="lv-info"><span class="lv-name">' + escHtml(e.livery) + '</span>' +
      '<span class="lv-country">' + escHtml(e.country) + ' · ' + escHtml(tn('panel.count', e.count)) + '</span></div></div></div>';
  });
  document.getElementById('panel-liveries').innerHTML = lhtml || '<div class="none">' + escHtml(t('panel.noLiveries')) + '</div>';
  renderActionBar(type);
  // Désactivé tant qu'aucune case de ce type n'est cochée
  document.getElementById('btn-apply-settings').disabled = !canApply;
}

// « A ×2, C ×1 » : les lettres actuelles des appareils visés, dans l'ordre des lettres
function lettersSummary(units, info) {
  const n = new Map();
  for (const u of units) { const l = info.cur.get(u.unitId); if (l) n.set(l, (n.get(l) || 0) + 1); }
  return info.list.filter(d => n.has(d.letter)).map(d => d.letter + ' ×' + n.get(d.letter)).join(', ');
}

// La barre d'action : dit ce qui va se passer, un bouton « Appliquer » par choix
function renderActionBar(type) {
  const bar = document.getElementById('action-bar');
  const info = getLoadouts(type);
  const ch = UI_STATE.choice;
  const rows = [];
  const def = ch.loadout ? info.list.find(d => d.letter === ch.loadout) : null;
  if (def) {
    const targets = loadoutTargets(type, def);
    const cur = lettersSummary(targets, info);
    const txt = t(targets.length > 0 && cur ? 'bar.loadout' : 'bar.loadout0')
      .replace('{l}', def.letter).replace('{n}', tn('panel.count', targets.length)).replace('{cur}', cur);
    rows.push({ act: 'loadout', txt, disabled: targets.length === 0 });
  }
  const lv = ch.livery ? getLiveries(type).find(e => e.key === ch.livery) : null;
  if (lv) {
    const targets = liveryTargets(type, lv);
    rows.push({ act: 'livery', txt: t('bar.livery').replace('{n}', tn('panel.count', targets.length)).replace('{name}', lv.livery), disabled: targets.length === 0 });
  }
  if (rows.length === 0) rows.push({ act: 'none', txt: t('bar.none'), disabled: true });
  bar.innerHTML = rows.map(r =>
    '<div class="bar-row"><span class="bar-text">' + escHtml(r.txt) + '</span>' +
    '<button class="btn-apply btn-bar" data-act="' + r.act + '"' + (r.disabled ? ' disabled' : '') + '>' + escHtml(t('bar.apply')) + '</button></div>').join('');
}

// Un clic sur une carte la choisit (une seule par liste) ; un second clic la lâche.
function chooseCard(kind, value) {
  const type = panelType();
  if (type === null) return;
  if (UI_STATE.choice.type !== type) UI_STATE.choice = { type, loadout: null, livery: null };
  UI_STATE.choice[kind] = (UI_STATE.choice[kind] === value) ? null : value;
  const sel = kind === 'loadout' ? '#panel-loadouts .ld-card' : '#panel-liveries .lv-card';
  const lvs = kind === 'livery' ? getLiveries(type) : null;
  document.querySelectorAll(sel).forEach(c => {
    const v = kind === 'loadout' ? c.dataset.letter : (lvs[Number(c.dataset.index)] || {}).key;
    const on = UI_STATE.choice[kind] === v;
    c.classList.toggle('chosen', on);
    c.setAttribute('aria-pressed', on);
  });
  renderActionBar(type);
}

// Applique l'onglet courant (sans effet au-dessus de 768 px : la feuille de style ne s'en sert pas)
function showTab() {
  document.getElementById('le-body').dataset.tab = UI_STATE.tab;
  document.getElementById('tab-list').classList.toggle('active', UI_STATE.tab === 'list');
  document.getElementById('tab-panel').classList.toggle('active', UI_STATE.tab === 'panel');

function renderBars() {
  const rows = UI_STATE.filtered;
  document.getElementById('display-count').innerHTML = escHtml(t('info.display')).replace('{x}', '<span>' + rows.length + '</span>').replace('{n}', '<span>' + UI_STATE.aircraft.length + '</span>');
  const nSel = UI_STATE.selected.size;
  const visSet = new Set(rows.map(u => u.unitId));
  let hidden = 0;
  for (const id of UI_STATE.selected) if (!visSet.has(id)) hidden++;
  document.getElementById('sel-count').textContent = nSel === 0 ? '' :
    (hidden > 0 ? t('info.selectedHidden').replace('{n}', nSel).replace('{m}', hidden) : t('info.selected').replace('{n}', nSel));

  const n = UI_STATE.edits.size;
  document.getElementById('mod-count').innerHTML = '<strong>' + n + '</strong> ' + escHtml(t('footer.count.' + (n > 1 ? 'other' : 'one')));
  const saveBtn = document.getElementById('btn-save');
  saveBtn.disabled = n === 0;
  saveBtn.title = n > 0 ? t('footer.save.titleEnabled').replace('{n}', n) : t('footer.save.titleDisabled');
  document.getElementById('btn-revert-all').disabled = n === 0;

  const wrap = document.getElementById('toggle-modified-wrap');
  const chk = document.getElementById('toggle-modified');
  if (n > 0) wrap.style.display = '';
  else {
    wrap.style.display = 'none';
    if (UI_STATE.showModifiedOnly) { UI_STATE.showModifiedOnly = false; chk.checked = false; renderTable(); }
  }
}

  renderTable();

// Onglets
document.getElementById('le-tabs').addEventListener('click', function(e) {

// Panneau du type
function cardActivate(e, listId, kind, valueOf) {
  if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
  const c = e.target.closest(listId + ' .' + (kind === 'loadout' ? 'ld-card' : 'lv-card'));
  if (!c) return;
  if (e.type === 'keydown') e.preventDefault();
  chooseCard(kind, valueOf(c));
}
['click', 'keydown'].forEach(ev => {
  document.getElementById('panel-loadouts').addEventListener(ev, e => cardActivate(e, '#panel-loadouts', 'loadout', c => c.dataset.letter));
  document.getElementById('panel-liveries').addEventListener(ev, e => cardActivate(e, '#panel-liveries', 'livery', c => {
    const type = panelType();
    const entry = type === null ? null : getLiveries(type)[Number(c.dataset.index)];
    return entry ? entry.key : null;
  }));
});
document.getElementById('action-bar').addEventListener('click', function(e) {
  const b = e.target.closest('.btn-bar');
  if (!b || b.disabled) return;
  const type = panelType();
  if (type === null) return;
  if (b.dataset.act === 'loadout') {
    if (UI_STATE.choice.loadout) applyLoadoutToSelection(UI_STATE.choice.loadout);
  } else if (b.dataset.act === 'livery') {
    const entry = getLiveries(type).find(x => x.key === UI_STATE.choice.livery);
    if (entry) applyLiveryToSelection(entry.country, entry.livery);
  }
});
document.getElementById('btn-apply-settings').addEventListener('click', applySettingsToSelection);

document.getElementById('btn-revert-all').addEventListener('click', () => {

// ═══════════════════════════════════════════════════════════════
// SAUVEGARDE
// ═══════════════════════════════════════════════════════════════
// Retrait (tabulations) de la ligne où commence une valeur : serializeLua y aligne ses lignes.
function lxIndentAt(src, offset) {
  const ls = src.lastIndexOf('\n', offset - 1) + 1;
  let n = 0;
  while (src[ls + n] === '\t') n++;
  return n;
}

// Un patch par valeur : le payload est remplacé en entier, la livrée par son texte.
function collectPatches(src) {
  const patches = [];
  const wanted = { payload: new Map(), livery: new Map() };
  for (const [id, ed] of UI_STATE.edits) {
    const u = UI_STATE.byId.get(id);
    if (!u) throw new Error('unitId ' + id + ' introuvable');
    if (ed.payload !== undefined) {
      if (!u.payloadPos) throw new Error('payload sans position : ' + u.name);
      const str = serializeLua(ed.payload, lxIndentAt(src, u.payloadPos.start.offset));
      if (str === null) throw new Error('payload non sérialisable : ' + u.name);
      patches.push({ pos: u.payloadPos, newValueStr: str });
      wanted.payload.set(id, ed.payload);
    }
    if (ed.livery !== undefined) {
      if (!u.liveryPos) throw new Error('livery_id sans position : ' + u.name);
      patches.push({ pos: u.liveryPos, newValueStr: serializeLua(String(ed.livery)) });
      wanted.livery.set(id, String(ed.livery));
    }
  }
  // Offsets décroissants : un patch ne décale pas ceux qui restent à appliquer
  patches.sort((a, b) => b.pos.start.offset - a.pos.start.offset);
  return { patches, wanted };
}

// Relit le texte écrit : chaque payload et livery_id écrit doit égaler la valeur voulue,
// et tout appareil non modifié doit être resté tel quel. Retourne { error } ou { ast, aircraft }.
function verifyWrite(patchedSrc, wanted) {
  const { tokens, errors } = DCS_TOKENIZER.tokenize(patchedSrc);
  if (errors.length > 0) return { error: 'tokeniseur : ' + errors[0].message + ' L' + (errors[0].line + 1) };
  const ast = DCS_PARSER.parse(tokens);
  const re = lxWalkAircraft(ast);
  if (re.length !== UI_STATE.aircraft.length) return { error: 'appareils : ' + re.length + ' ≠ ' + UI_STATE.aircraft.length };
  // Même ordre de parcours avant et après : on compare appareil par appareil (les unitId peuvent être en double)
  for (let i = 0; i < UI_STATE.aircraft.length; i++) {
    const u = UI_STATE.aircraft[i];
    const u2 = re[i];
    if (!u2 || u2.unitId !== u.unitId) return { error: 'unitId ' + u.unitId + ' disparu' };
    const wantP = wanted.payload.has(u.unitId) ? wanted.payload.get(u.unitId) : u.payload;
    const wantL = wanted.livery.has(u.unitId) ? wanted.livery.get(u.unitId) : u.livery;
    if (!deepEqValues(wantP, u2.payload)) return { error: 'payload ' + u.name + ' (' + u.unitId + ')' };
    if (wantL !== u2.livery) return { error: 'livery_id ' + u.name + ' (' + u.unitId + ')' };
  }
  return { ast, aircraft: re };
}

document.getElementById('btn-save').addEventListener('click', async () => {
  if (!UI_STATE.model || UI_STATE.edits.size === 0) return;
  showSpinner(t('spinner.patching'));
  try {
    await new Promise(r => setTimeout(r, 0));

    const srcText = UI_STATE.model.source._text;
    const { patches, wanted } = collectPatches(srcText);
    console.log('[Save] Patches :', patches.length);

    const patchedSrc = applyPatches(srcText, patches);
    retokenizeSafety(patchedSrc); // throw si KO

    showSpinner(t('spinner.verifying'));
    await new Promise(r => setTimeout(r, 0));
    let verdict;
    try { verdict = verifyWrite(patchedSrc, wanted); }
    catch (err) { verdict = { error: err.message }; }
    if (verdict.error) {
      console.error('[Save] Vérification échouée :', verdict.error);
      showToast(t('toast.verifyFailed') + ' ' + verdict.error, 'error');
      return;
    }

    showSpinner(t('spinner.rebuilding'));
    await new Promise(r => setTimeout(r, 0));
    const blob = await rebuildMizHQ(patchedSrc);

    // Nom de fichier sortant
    const origName = UI_STATE.model.source.miz.filename.replace(/\.miz$/i, '');
    const now = new Date();
    const ts = now.getFullYear().toString()
      + String(now.getMonth()+1).padStart(2,'0')
      + String(now.getDate()).padStart(2,'0')
      + '-'
      + String(now.getHours()).padStart(2,'0')
      + String(now.getMinutes()).padStart(2,'0')
      + String(now.getSeconds()).padStart(2,'0');
    const outName = origName + '_loadout_' + ts + '.miz';

    const dl = new Blob([blob], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(dl);
    const a = document.createElement('a');
    a.href = url;
    a.download = outName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);

    // Greffe MT_onModuleSave (inerte en standalone)
    if (window.parent !== window && window.parent.MT_onModuleSave) {
      window.parent.MT_onModuleSave(blob, outName);
    }

    // Le texte écrit devient la base : plus rien n'est « non sauvegardé »
    const nMod = UI_STATE.edits.size;
    const otherFilesMap = _HQ_MIZ_CONTEXT.otherFilesMap;
    let extracted;
    try {
      extracted = DCS_EXTRACTOR.extract(verdict.ast, patchedSrc, UI_STATE.model.source.miz.filename, otherFilesMap, patchedSrc.split('\n'));
    } catch (err2) {
      // Le fichier est déjà téléchargé : aucune modification ne reste en attente, on repart d'un fichier neuf
      console.error('[Save] Relecture après téléchargement :', err2);
      returnToDropZone();
      showToast(t('toast.savedReopen'), 'warn');
      return;
    }
    UI_STATE.edits = new Map();
    setModel({ source: extracted.source, aircraft: verdict.aircraft });
    renderAll();

    showToast(t('toast.saved').replace('{file}', outName).replace('{n}', nMod), 'success');
  } catch (err) {
    console.error('[Save] Erreur :', err);
    showToast(t('toast.saveError') + ' ' + err.message, 'error');
  } finally {
    hideSpinner();
  }
});

// ═══════════════════════════════════════════════════════════════
// CHARGEMENT FICHIER
// ═══════════════════════════════════════════════════════════════
function handleFile(file) {
  if (!file || !file.name.toLowerCase().endsWith('.miz')) {
    showToast(t('toast.pickFile'), 'warn');
    return;
  }
  loadMiz(file);
}

document.getElementById('btn-browse').addEventListener('click', () => {
  document.getElementById('file-input').click();
});
document.getElementById('drop-box').addEventListener('click', () => {
  document.getElementById('file-input').click();
});
document.getElementById('file-input').addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});
function returnToDropZone() {
  UI_STATE.model = null;
  UI_STATE.edits = new Map();
  UI_STATE.selected = new Set();
  UI_STATE.rev++;
  document.getElementById('main-ui').classList.add('hidden');
  document.getElementById('modifications-bar').classList.add('hidden');
  document.getElementById('drop-zone').classList.remove('hidden');
  const hdr = document.getElementById('header-miz');
  hdr.textContent = t('header.noFile');
  hdr.classList.add('empty');
  document.getElementById('file-input').value = '';
}
document.getElementById('btn-load-new').addEventListener('click', returnToDropZone);

// Drag & drop
const dropBox = document.getElementById('drop-box');
dropBox.addEventListener('dragover', e => { e.preventDefault(); dropBox.classList.add('drag-over'); });
dropBox.addEventListener('dragleave', () => dropBox.classList.remove('drag-over'));
dropBox.addEventListener('drop', e => {
  e.preventDefault();
  dropBox.classList.remove('drag-over');
  e.stopPropagation();   // sinon le gestionnaire de la page recharge le même fichier
  const file = e.dataTransfer.files[0];
  handleFile(file);
});

// Drag & drop sur toute la page (hors main-ui)
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  if (document.getElementById('drop-zone').classList.contains('hidden')) return;
  const file = e.dataTransfer.files[0];
  handleFile(file);
});
</script>
